version: 2

models:
  - name: customers
    description: One row per customer with lifetime value. Built by Hevo Transformations.
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: orders
    description: One row per order with payments split by method.
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('customers')
              field: customer_id
