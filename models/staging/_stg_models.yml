version: 2

models:
  - name: stg_customers
    description: One row per customer.
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: stg_orders
    description: One row per order.
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: status
        tests:
          - accepted_values:
              values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']

  - name: stg_payments
    description: One row per payment, amount converted from cents.
    columns:
      - name: payment_id
        tests:
          - unique
          - not_null
      - name: payment_method
        tests:
          - accepted_values:
              values: ['credit_card', 'debit_card', 'bank_transfer', 'gift_card']
